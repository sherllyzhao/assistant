name: Release desktop installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    env:
      SHERLLY_RENDERER_URL: ${{ vars.SHERLLY_RENDERER_URL }}
      VITE_SHERLLY_API_URL: ${{ vars.VITE_SHERLLY_API_URL }}
      VITE_SHERLLY_API_TOKEN: ${{ secrets.VITE_SHERLLY_API_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write desktop renderer config
        run: npm run renderer:config

      - name: Check target files
        run: npm run check

      - name: Build renderer
        run: npm run build

      - name: Publish installer
        run: npx electron-builder --win nsis --x64 --publish always
