services:
  - type: web
    name: sherlly-server
    env: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: sherlly
      - key: MONGODB_COLLECTION
        value: appData
      - key: SHERLLY_USER_ID
        value: default
      - key: SHERLLY_API_TOKEN
        sync: false
      - key: CORS_ORIGIN
        value: "*"
